<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Armurerie Forever</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Armurerie Forever</h1>
    <a class="lien-sim" href="/simulateur/">Simulateur de duel druide</a>
    <form id="add">
      <input id="full" placeholder="Prénom Nom (ex. Ohm Let)" required autocomplete="off">
      <select id="region">
        <option value="eu" selected>Europe</option>
        <option value="us">Amériques</option>
        <option value="kr">Corée</option>
        <option value="tw">Taïwan</option>
      </select>
      <button type="submit">Ajouter</button>
    </form>
    <div class="tools">
      <button id="refresh-all" type="button">Tout réactualiser</button>
      <span id="status"></span>
    </div>
  </header>
  <p id="error" hidden></p>
  <main id="list"></main>
  <script src="app.js"></script>
</body>
</html>
